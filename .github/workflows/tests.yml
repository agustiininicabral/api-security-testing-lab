name: API Security Tests

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Check Python formatting
        run: ruff format --check app tests

      - name: Run Ruff lint checks
        run: ruff check app tests

      - name: Run security tests
        run: python -m pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always() && hashFiles('pytest-report.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: api-security-test-report
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 7
